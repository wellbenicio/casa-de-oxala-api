name: Auto Delete Branch After Merge

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  delete-branch:
    name: Delete Merged Branch
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Delete head branch
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request.head.ref;
            const protected_branches = ['main', 'develop'];

            if (protected_branches.includes(ref)) {
              console.log(`Skipping protected branch: ${ref}`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${ref}`,
              });
              console.log(`Branch '${ref}' deleted successfully.`);
            } catch (error) {
              if (error.status === 422) {
                console.log(`Branch '${ref}' was already deleted.`);
              } else {
                throw error;
              }
            }
