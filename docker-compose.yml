services:
  postgres:
    image: postgres:17-alpine
    container_name: casadeoxala-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: casadeoxala
      POSTGRES_USER: casadeoxala
      POSTGRES_PASSWORD: casadeoxala
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casadeoxala -d casadeoxala"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
